apiVersion: apps/v1
kind: Deployment
metadata:
  name: api--customer
  namespace: iaton
spec:
  selector:
    matchLabels:
      app: api--customer
  template: 
    metadata:
        name: api--customer
        labels:
          app: api--customer
    spec:
        containers:
          - name: api--customer
            image: $dck-accountid/$dck-repository:api--customer-user-$githash
            envFrom:
              - configMapRef:
                  name: api--customer-cm
            ports:
              - containerPort: 5000
              - containerPort: 9190
            livenessProbe:
              httpGet:
                path: /actuator/health
                port: 9190
              initialDelaySeconds: 120
              periodSeconds: 60
              timeoutSeconds: 10
              successThreshold: 1
              failureThreshold: 2
            readinessProbe:
              httpGet:
                path: /actuator/health
                port: 9190
              initialDelaySeconds: 120
              periodSeconds: 10
              timeoutSeconds: 10