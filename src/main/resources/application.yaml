server:
  max-http-request-size: 60000
  shutdown: graceful
  servlet:
    context-path: /api--customer-user
  port: 5000

spring:
  application:
    name: api--customer-user
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:dev}"
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mapping: false
  jackson:
    serialization:
      write_dates_as_timestamps: false
      fail-on-empty-beans: false
    default-property-inclusion: non_null
  main:
    banner-mode: "OFF"
    retry:
      max-attempts: 5000
      initial-interval: 1500
      multiplier: 1.5
      compatibility-verifier:
        enabled: false
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: ${SPRING_JPA_TIMEZONE:America/Sao_Paulo}
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:password}
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DATABASE:db}
    tomcat:
      max-active: ${SPRING_DATASOURCE_MAX_ACTIVE:10}

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVER:localhost:9092}
  schemaRegistry: ${KAFKA_SCHEMA_REGISTRY:http://localhost:8081}
  retryMaxAttempts: 3
  notification:
    topic: kfk-notification
    groupId: grp-notification

info:
  app:
    name: "@project.name@"
    version: "@project.version@"
    description: "@project.description@ "
    base-package: "br.com.iaquant.api.customer"

management:
  server:
    port: 9090
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, shutdown, prometheus
  endpoint:
    shutdown:
      enabled: true
      health:
        show-details: always
        probes:
          enabled: true
        group:
          readiness:
            include: diskSpace
  tracing:
    baggage:
      enabled: 'true'
    propagation:
      type: 'w3c '
    enabled: 'true'
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

